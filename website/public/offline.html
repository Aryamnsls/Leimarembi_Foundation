<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A57">
  <meta name="robots" content="noindex, nofollow">
  <title>You're offline · Leimarembi Foundation</title>
  <style>
    :root{color-scheme:light;--navy:#1B2A57;--blue:#0284C7;--gold:#F59E0B;--ink:#0F172A;--muted:#475569;--paper:#F8FAFC}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 50% 5%,#dbeafe 0,transparent 44%),var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:36px 28px;text-align:center;background:#fff;border:1px solid #dbe3ef;border-radius:26px;box-shadow:0 22px 70px rgba(27,42,87,.10)}
    .mark{width:74px;height:74px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;background:var(--navy);color:#fff;border:2px solid var(--gold);font-size:25px;font-weight:800;letter-spacing:-2px}
    h1{margin:0 0 10px;color:var(--navy);font-size:clamp(25px,6vw,32px);line-height:1.2;letter-spacing:-.8px}p{margin:0 auto 24px;color:var(--muted);max-width:34ch}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 17px;border-radius:12px;font-weight:700;text-decoration:none}.primary{background:var(--navy);color:#fff}.secondary{border:1px solid #cbd5e1;color:var(--navy);background:#fff;cursor:pointer;font-family:inherit;font-size:16px}.note{margin-top:22px;font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">LF</div>
    <h1>You're currently offline</h1>
    <p>Leimarembi Foundation needs an internet connection for this page. Reconnect to continue securely. Your account information is not stored for offline access.</p>
    <div class="actions"><a class="btn primary" href="/">Return to home</a><button class="btn secondary" type="button" onclick="window.location.reload()">Try again</button></div>
    <p class="note">Official Digital Governance &amp; Community Development Platform</p>
  </main>
</body>
</html>
